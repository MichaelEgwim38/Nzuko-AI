<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nzuko AI QR</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7f8;
        color: #16222b;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(520px, calc(100% - 32px));
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 18px;
        color: #61717d;
        line-height: 1.5;
      }

      img {
        width: min(380px, 92vw);
        height: auto;
        border: 16px solid #ffffff;
        border-radius: 8px;
        box-shadow: 0 10px 34px rgba(22, 34, 43, 0.12);
      }

      button {
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        background: #6fbf4a;
        color: #102016;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 12px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect Nzuko AI</h1>
      <p>Use the approved WhatsApp account: Settings, Linked devices, Link a device.</p>
      <div id="qr">Loading QR...</div>
      <button id="refresh">Refresh QR</button>
    </main>
    <script>
      async function loadQr() {
        const response = await fetch('/api/waha/qr');
        const payload = await response.json();
        if (!response.ok || !payload.qr?.data) {
          document.querySelector('#qr').textContent = payload.error || 'QR is not ready. Start the WAHA session and refresh.';
          return;
        }
        document.querySelector('#qr').innerHTML = `<img alt="WhatsApp login QR" src="data:${payload.qr.mimetype};base64,${payload.qr.data}" />`;
      }

      document.querySelector('#refresh').addEventListener('click', loadQr);
      loadQr();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nzuko AI Offline</title>
    <meta name="theme-color" content="#245d38" />
    <style>
      :root {
        color-scheme: light;
        --bg: #eef6ed;
        --ink: #201914;
        --muted: #6d6054;
        --panel: #ffffff;
        --accent: #6fae45;
        --accent-dark: #245d38;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(111, 174, 69, 0.18), transparent 24%),
          linear-gradient(180deg, #f7fbf5, var(--bg));
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .card {
        width: min(460px, 100%);
        padding: 32px 28px;
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 24px 60px rgba(12, 18, 14, 0.16);
        text-align: center;
      }

      img {
        width: 64px;
        height: 64px;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: 32px;
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--accent-dark);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/assets/nzuko-mark.svg" alt="" />
      <h1>You're offline</h1>
      <p>Nzuko AI needs an internet connection for sign-in, billing, and WhatsApp sync. Reconnect and reopen the workspace to continue.</p>
      <a href="/">Try again</a>
    </main>
  </body>
  </html>
